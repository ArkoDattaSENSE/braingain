<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>BrainGain</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #f4f5f7; padding: 24px; }
    main { width: min(420px, 100%); background: #15191f; border: 1px solid #303640; border-radius: 22px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #aeb5c0; line-height: 1.5; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; color: #0b0d10; background: #f0f3f6; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>BrainGain</h1>
    <p>Opening your private library. Google will ask you to sign in if needed.</p>
    <a id="open" href="https://script.google.com/macros/s/AKfycbwvuxyq5rt77QWxkflx4gdLNKLUiA7q2r2Gg2Zqgv2Sv52KmcJTJ7cNzdHAg3gw1Oa6/exec">Open BrainGain</a>
  </main>
  <script>window.location.replace(document.getElementById('open').href);</script>
</body>
</html>
