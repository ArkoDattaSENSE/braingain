<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>BrainGain</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="shell">

  <header>

    <div class="brandrow">

      <div>
        <h1>BrainGain</h1>
        <div class="sub">
          your feed, minus the algorithmic sewage
        </div>
      </div>

      <div class="brandright">
        <div class="sub" id="sync">syncing…</div>
        <button
          id="refresh"
          class="refresh"
          title="Refresh"
          aria-label="Refresh"
        >↻</button>
      </div>

    </div>

    <input
      id="search"
      class="search"
      placeholder="Search title, creator, tags…"
    >

    <div class="chips" id="chips"></div>

  </header>

  <main>

    <div class="stats">
      <span id="count"></span>
      <span id="modeLabel">Recommended</span>
    </div>

    <div id="feed" class="feed">
      <div class="loader">
        Loading your brain food…
      </div>
    </div>

  </main>

</div>


<nav class="tabs">
  <button class="tab active" data-mode="recommended">
    For you
  </button>

  <button class="tab" data-mode="liked">
    ♥ Liked
  </button>

  <button class="tab" data-mode="watched">
    ✓ Watched
  </button>

  <button class="tab" data-mode="watchlist">
    Watchlist
  </button>
</nav>


<div
  class="modal"
  id="modal"
  role="dialog"
  aria-modal="true"
>
  <div
    class="sheet"
    id="detailSheet"
  ></div>
</div>


<script src="app.js" defer></script>

</body>
</html>
